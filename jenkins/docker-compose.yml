services:
  web:
    build: .
    image: phcdashboard:${APP_TAG:-local}
    container_name: phcdashboard-web
    ports:
      - "8082:80"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    restart: unless-stopped
    healthcheck:
      # Adjust the path if you have a lighter endpoint than the homepage.
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
