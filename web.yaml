---
# Deployment. DB credentials come from the `phc-db` Secret, which Jenkins
# creates from its own credential store — never from a file in the repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phc-web
  labels:
    app: phc-web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: phc-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: phc-web
    spec:
      containers:
        - name: web
          image: phc-web:PLACEHOLDER   # Jenkins overwrites via `kubectl set image`
          imagePullPolicy: Never       # image lives only in the local Docker engine
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: phc-db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi            # PHP memory_limit is 512M; leave headroom
          readinessProbe:
            httpGet:
              path: /api.php?_p=api/pilots
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: phc-web
spec:
  type: NodePort
  selector:
    app: phc-web
  ports:
    - port: 80
      targetPort: http
      nodePort: 30082
