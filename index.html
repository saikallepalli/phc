/* =========================================================================
   GEOGRAPHICAL MAP
   ========================================================================= */
let _leafletLoaded = false;
let _leafletLoading = false;
let _geoMap = null;
let _geoMarkerLayer = null;
const _geoCoordCache = {};

function openGeoModal() {
  document.getElementById('geoOverlay').classList.remove('hidden');
  if (_leafletLoaded) {
    initGeoMap();
  } else if (!_leafletLoading) {
    _leafletLoading = true;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = () => { _leafletLoaded = true; initGeoMap(); };
    document.head.appendChild(script);
  }
}

async function loadDistrictBoundary() {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?q=Srikakulam+district+Andhra+Pradesh+India&format=geojson&polygon_geojson=1&limit=1';
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return;
    const data = await r.json();
    const feature = (data.features || [])[0];
    if (!feature) return;
    L.geoJSON(feature, {
      style: {
        color: '#1f53b8',
        weight: 2,
        fillColor: '#2f6bdc',
        fillOpacity: 0.07,
        dashArray: '7 5'
      }
    }).addTo(_geoMap);
  } catch(e) {}
}

function initGeoMap() {
  if (!_geoMap) {
    _geoMap = L.map('geoMapEl').setView([18.2949, 83.8938], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(_geoMap);
    _geoMarkerLayer = L.layerGroup().addTo(_geoMap);
    loadDistrictBoundary();
  }
  setTimeout(() => _geoMap.invalidateSize(), 120);
  _geoMarkerLayer.clearLayers();
  plotGeoMarkers();
}

function parseGeoLatLng(url) {
  if (!url) return null;
  let m = url.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if (m) return [parseFloat(m[1]), parseFloat(m[2])];
  m = url.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if (m) return [parseFloat(m[1]), parseFloat(m[2])];
  m = url.match(/[?&]ll=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if (m) return [parseFloat(m[1]), parseFloat(m[2])];
  return null;
}

function addGeoMarker(phc, latlng) {
  const popup = `<strong>${escapeHtml(phc.name)}</strong><br><span style="color:#6b7280;font-size:12px">${escapeHtml(phc.mandal||'')}</span>${phc.location?`<br><a href="${escapeHtml(phc.location)}" target="_blank" rel="noopener" style="color:#1d4ed8;font-size:12px">View on Google Maps →</a>`:''}`;
  L.marker(latlng).addTo(_geoMarkerLayer).bindPopup(popup);
}

function setGeoPreloader(msg) {
  const el = document.getElementById('geoPreloader');
  const msgEl = document.getElementById('geoPreloaderMsg');
  if (!el) return;
  if (msg) { el.style.display = 'flex'; if (msgEl) msgEl.textContent = msg; }
  else { el.style.display = 'none'; }
}

function setGeoFoot(msg, spinning) {
  const foot = document.getElementById('geoFoot');
  if (!foot) return;
  foot.innerHTML = spinning
    ? `<span class="geo-spinner"></span><span>${msg}</span>`
    : `<span>${msg}</span>`;
}

async function geocodeName(name) {
  const q = encodeURIComponent(name + ', Srikakulam, Andhra Pradesh, India');
  try {
    const r = await fetch(`https://photon.komoot.io/api/?q=${q}&limit=1&lang=en`);
    if (!r.ok) return null;
    const data = await r.json();
    const f = (data.features || [])[0];
    if (!f) return null;
    const [lng, lat] = f.geometry.coordinates;
    return [lat, lng];
  } catch(e) { return null; }
}

function plotGeoMarkers() {
  const phcs = DATA.phcs;
  const bounds = [];
  let placed = 0;
  const toGeocode = [];

  phcs.forEach(p => {
    if (_geoCoordCache[p.id] !== undefined) {
      if (_geoCoordCache[p.id]) { addGeoMarker(p, _geoCoordCache[p.id]); bounds.push(_geoCoordCache[p.id]); placed++; }
      return;
    }
    const ll = parseGeoLatLng(p.location);
    if (ll) {
      _geoCoordCache[p.id] = ll;
      addGeoMarker(p, ll); bounds.push(ll); placed++;
    } else {
      toGeocode.push(p);
    }
  });

  function fitMap() {
    if (bounds.length > 1) _geoMap.fitBounds(L.latLngBounds(bounds), {padding:[40,40]});
    else if (bounds.length === 1) _geoMap.setView(bounds[0], 13);
  }

  function done() {
    setGeoPreloader(null);
    const missing = phcs.length - placed;
    setGeoFoot(
      `Showing ${placed} of ${phcs.length} PHC locations.${missing ? ` (${missing} could not be located)` : ''}`,
      false
    );
    fitMap();
  }

  if (!toGeocode.length) { done(); return; }

  setGeoPreloader(`Locating PHCs… 0 of ${toGeocode.length}`);

  let idx = 0;
  async function geocodeNext() {
    if (idx >= toGeocode.length) { done(); return; }
    const p = toGeocode[idx++];
    setGeoPreloader(`Locating ${p.name}… (${idx} of ${toGeocode.length})`);
    const ll = await geocodeName(p.name);
    if (ll) {
      _geoCoordCache[p.id] = ll;
      addGeoMarker(p, ll); bounds.push(ll); placed++;
    } else {
      _geoCoordCache[p.id] = null;
    }
    setTimeout(geocodeNext, 300);
  }
  geocodeNext();
}

document.getElementById('geoCloseBtn').addEventListener('click', () => {
  document.getElementById('geoOverlay').classList.add('hidden');
});
document.getElementById('geoOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('geoOverlay')) document.getElementById('geoOverlay').classList.add('hidden');
});
